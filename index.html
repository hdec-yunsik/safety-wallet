async function saveInspection(e){e.preventDefault();let rows=$$('.evrow'),answers=rows.map((r,i)=>({id:r.dataset.check,text:r.children[1].textContent,result:$(`[name="ev${i}"]:checked`)?.value||''}));if(!answers.length||answers.some(x=>!x.result))return alert('모든 점검내용을 평가해 주세요.');if(!photoFile)return alert('사진을 선택해 주세요.');let btn=$('#submitBtn');btn.disabled=true;btn.textContent='서버 저장 중...';try{let blob=await imageFile(photoFile),id=crypto.randomUUID(),path=`incoming/${today()}/${id}.jpg`;let up=await fetch(SUPABASE_URL+'/storage/v1/object/inspection-photos/'+path,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'image/jpeg','x-upsert':'false'},body:blob});if(!up.ok)throw new Error('사진 업로드 실패: '+await up.text());let bad=answers.filter(x=>x.result==='불량'),theme=themes.find(x=>x.id===$('#themeSel').value),item=items.find(x=>x.id===$('#itemSel').value),note=$('#note').value.trim()||(bad.length?bad.map(x=>'불량: '+x.text).join(' / '):'특이사항 없음');await rest('inspections',{method:'POST',body:JSON.stringify({id,inspection_date:$('#date').value,theme_id:theme.id,inspection_item_id:item.id,inspector_id:$('#inspector').value,company_id:$('#company').value,location_text:$('#location').value.trim(),overall_result:bad.length?'부적합':'적합',note,photo_path:path})});await rest('inspection_answers',{method:'POST',body:JSON.stringify(answers.map(x=>({inspection_id:id,checklist_entry_id:x.id,checklist_text_snapshot:x.text,result:x.result})))});alert('등록 완료! 수고하셨습니다 :)');e.target.reset();photoFile=null;$('#preview').style.display='none';show('home')}catch(e){alert('저장 실패: '+e.message)}finally{btn.disabled=false;btn.textContent='서버에 등록하기'}}
function requireAdmin(target){pendingAdmin=target;if(adminPassword)return openAdminPage(target);$('#adminPw').value='';$('#adminModal').classList.add('on')}async function openAdminPage(target){if(target==='results'){show('results');await loadResults()}if(target==='registry'){show('registry');renderRegistry()}if(target==='edit'){show('edit');renderEditSelects()}}
async function loadResults(){try{let j=await admin('get-inspections',{from:$('#from').value,to:$('#to').value});adminRows=j.data||[];renderResults()}catch(e){alert(e.message)}}function label(r){return group==='inspector'?r.inspectors?.display_name:group==='company'?r.companies?.company_name:r.inspection_items?.item_name}function renderResults(){let g=adminRows.filter(x=>x.overall_result==='적합').length,b=adminRows.length-g;$('#sg').textContent=g;$('#sb').textContent=b;$('#st').textContent=adminRows.length;let vals=[...new Set(adminRows.map(label))],rs=vals.map(v=>{let a=adminRows.filter(x=>label(x)===v),gg=a.filter(x=>x.overall_result==='적합').length;return{v,g:gg,b:a.length-gg,t:a.length}}).sort((a,b)=>group==='inspector'?b.b-a.b:b.t-a.t);let row=(v,g,b,t,c='')=>`<tr class="${c}"><td>${esc(v||'계')}</td><td><button class="link" data-d="${encodeURIComponent(v||'')}|적합">${g}</button></td><td><button class="link" data-d="${encodeURIComponent(v||'')}|부적합">${b}</button></td><td><button class="link" data-d="${encodeURIComponent(v||'')}|">${t}</button></td></tr>`;$('#resultBody').innerHTML=row('',g,b,adminRows.length,'totalrow')+rs.map(x=>row(x.v,x.g,x.b,x.t)).join('');$$('[data-d]').forEach(x=>x.onclick=()=>{let[v,res]=x.dataset.d.split('|');showDetails(decodeURIComponent(v),res)})}function showDetails(v,res){let a=adminRows.filter(x=>(!v||label(x)===v)&&(!res||x.overall_result===res));$('#detailList').innerHTML=a.map(r=>`<article class="detail">${r.photo_url?`<img src="${r.photo_url}" alt="점검사진">`:''}<div class="dg"><b>일자</b><span>${r.inspection_date}</span><b>결과</b><span>${r.overall_result}</span><b>내용</b><span>${esc(r.note)}</span><b>위치</b><span>${esc(r.location_text)}</span><b>점검항목</b><span>${esc(r.themes?.theme_name)} / ${esc(r.inspection_items?.item_name)}</span><b>점검자</b><span>${esc(r.inspectors?.display_name)}</span><b>협력사</b><span>${esc(r.companies?.company_name)}</span></div></article>`).join('')||'<div class="empty">기록 없음</div>'}
function renderRegistry(){$('#tabIns').className='btn '+(regType==='inspector'?'primary':'light');$('#tabCom').className='btn '+(regType==='company'?'primary':'light');$('#codeField').style.display=regType==='inspector'?'grid':'none';$('#regLabel').textContent=regType==='inspector'?'점검자 이름':'협력사 이름';let a=regType==='inspector'?inspectors:companies;$('#regBody').innerHTML=a.map(x=>`<tr><td>${esc(x.display_name||x.company_name)}</td><td>${esc(x.inspector_code||'-')}</td><td>${String(x.created_at||'').slice(0,10)}</td><td><button class="btn danger" data-del="${x.id}">삭제</button></td></tr>`).join('');$$('[data-del]').forEach(x=>x.onclick=async()=>{if(!confirm('비활성화할까요?'))return;await admin(regType==='inspector'?'delete-inspector':'delete-company',{id:x.dataset.del});await loadMaster();renderRegistry()})}
function renderEditSelects(){$('#editTheme').innerHTML=themes.map(x=>`<option value="${x.id}">${esc(x.theme_name)}</option>`).join('');fillEditItems()}function fillEditItems(){let t=$('#editTheme').value;$('#editItem').innerHTML=items.filter(x=>x.theme_id===t).map(x=>`<option value="${x.id}">${esc(x.item_name)}</option>`).join('');renderEditRows()}function renderEditRows(){let a=checks.filter(x=>x.inspection_item_id===$('#editItem').value);$('#editRows').innerHTML=a.map(x=>`<div class="editrow"><input value="${esc(x.checklist_text)}" data-u="${x.id}"><button class="btn danger" data-cdel="${x.id}">삭제</button></div>`).join('');$$('[data-u]').forEach(x=>x.onchange=async()=>{await admin('update-check',{id:x.dataset.u,text:x.value});await loadMaster();alert('수정 완료')});$$('[data-cdel]').forEach(x=>x.onclick=async()=>{if(confirm('삭제할까요?')){await admin('delete-check',{id:x.dataset.cdel});await loadMaster();renderEditRows()}})}
history.replaceState({page:'home'},'',location.href);window.addEventListener('popstate',e=>{let id=e.state?.page||'home';$('#adminModal').classList.remove('on');$('#personalModal').classList.remove('on');show(id,false)});$('#back').onclick=()=>history.back();$$('[data-nav]').forEach(x=>x.onclick=()=>show(x.dataset.nav));$$('[data-admin]').forEach(x=>x.onclick=()=>requireAdmin(x.dataset.admin));$('#inspectOpen').onclick=()=>{show('inspect');$('#date').value=today();fillForm()};$('#themeSel').onchange=()=>{let a=items.filter(x=>x.theme_id===$('#themeSel').value);$('#itemSel').disabled=false;$('#itemSel').innerHTML='<option value="">선택</option>'+a.map(x=>`<option value="${x.id}">${esc(x.item_name)}</option>`).join('')};$('#itemSel').onchange=renderEval;$('#camera').onchange=selectPhoto;$('#gallery').onchange=selectPhoto;$('#form').onsubmit=saveInspection;$$('[data-key]').forEach(k=>k.onclick=()=>{let p=$('#adminPw'),v=k.dataset.key;if(v==='clear')p.value='';else if(v==='del')p.value=p.value.slice(0,-1);else if(p.value.length<20)p.value+=v});$('#adminCancel').onclick=()=>{$('#adminPw').value='';$('#adminModal').classList.remove('on')};$('#adminOk').onclick=async()=>{adminPassword=$('#adminPw').value;try{await admin('verify-admin');$('#adminPw').value='';$('#adminModal').classList.remove('on');openAdminPage(pendingAdmin)}catch(e){adminPassword='';alert(e.message)}};$('#from').value=$('#to').value=today();$('#resultSearch').onclick=loadResults;$$('[data-group]').forEach(x=>x.onclick=()=>{group=x.dataset.group;$$('[data-group]').forEach(b=>b.className='btn '+(b.dataset.group===group?'primary':'light'));renderResults()});$('#tabIns').onclick=()=>{regType='inspector';renderRegistry()};$('#tabCom').onclick=()=>{regType='company';renderRegistry()};$('#regAdd').onclick=async()=>{try{if(regType==='inspector')await admin('create-inspector',{display_name:$('#regName').value,inspector_code:$('#regCode').value});else await admin('create-company',{company_name:$('#regName').value});$('#regName').value=$('#regCode').value='';await loadMaster();renderRegistry()}catch(e){alert(e.message)}};$('#editTheme').onchange=fillEditItems;$('#editItem').onchange=renderEditRows;$('#addCheck').onclick=async()=>{let text=prompt('추가할 체크문구');if(text){await admin('create-check',{item_id:$('#editItem').value,text,sort_order:999});await loadMaster();renderEditRows()}};$('#personalOpen').onclick=()=>$('#personalModal').classList.add('on');$('#pClose').onclick=()=>$('#personalModal').classList.remove('on');$$('[data-group]')[0].click();loadMaster()})();
</script></body></html>
