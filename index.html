<section id="userHome" class="page"><h2>현장 점검자 메뉴</h2><div class="grid"><button data-nav="checklist" class="card"><i class="ico">📋</i><b>점검 체크리스트</b></button><button id="inspectStart1" class="card"><i class="ico">📷</i><b>점검 하기</b></button><button id="personalOpen" class="card"><i class="ico">🗂️</i><b>개인 점검기록</b></button></div></section>

</main></div><div id="adminModal" class="modal"><div class="box"><h2>관리자 인증</h2><input id="adminPw" type="password" inputmode="numeric" maxlength="4" placeholder="비밀번호 4자리"><p class="small">초기 비밀번호: 1234</p><div class="actions"><button data-close="adminModal" class="btn light">취소</button><button id="adminLogin" class="btn primary">확인</button></div></div></div><div id="personalModal" class="modal"><div class="box"><h2>개인 기록 확인</h2><input id="pName" list="insList" placeholder="점검자 이름"><input id="pDob" inputmode="numeric" maxlength="6" placeholder="생년월일 6자리" style="margin-top:8px"><div class="actions"><button data-close="personalModal" class="btn light">취소</button><button id="pLogin" class="btn primary">확인</button></div></div></div>

(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K={d:'rev11Data',r:'rev11Records',i:'rev11Inspectors',c:'rev11Companies'};const today=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)};let data=JSON.parse(localStorage.getItem(K.d)||'null')||DEFAULT_DATA,records=JSON.parse(localStorage.getItem(K.r)||'[]'),inspectors=JSON.parse(localStorage.getItem(K.i)||'null')||[{name:'홍길동',dob:'800101',date:today()}],companies=JSON.parse(localStorage.getItem(K.c)||'null')||[{name:'A협력사',date:today()}],hist=['role'],admin=false,photoData='',group='inspector',personal='',regType='i',ct=-1,ci=-1;const save=()=>{localStorage.setItem(K.d,JSON.stringify(data));localStorage.setItem(K.r,JSON.stringify(records));localStorage.setItem(K.i,JSON.stringify(inspectors));localStorage.setItem(K.c,JSON.stringify(companies))};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(id,push=true){$$('.page').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');if(push&&hist.at(-1)!==id)hist.push(id);$('#back').style.display=id==='role'?'none':'block';scrollTo(0,0)}function home(id){hist=['role'];show(id)}function modal(id,on){$('#'+id).classList.toggle('on',on)}function fillPeople(){$('#insList').innerHTML=inspectors.map(x=>`<option value="${esc(x.name)}">`).join('');$('#comList').innerHTML=companies.map(x=>`<option value="${esc(x.name)}">`).join('')}function renderChecklist(){$('#themes').innerHTML=data.map((x,i)=>`<button class="chip ${i===ct?'on':''}" data-t="${i}">${esc(x.theme)}</button>`).join('');$('#items').innerHTML=ct<0?'<div class="empty">테마를 선택하세요.</div>':`<b>점검항목</b><div class="chooser">${data[ct].items.map((x,i)=>`<button class="chip ${i===ci?'on':''}" data-i="${i}">${esc(x.name)}</button>`).join('')}</div>`;$('#checks').innerHTML=ci<0?'':`<b>체크리스트</b><ul class="list">${data[ct].items[ci].checks.map((x,i)=>
